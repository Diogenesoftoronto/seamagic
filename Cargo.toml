[package]
name = "seamagic"
version = "0.2.0"
edition = "2024"
description = "A Rust image design toolkit with CLI and MCP server"
authors = ["Dio the Debugger <me@dio.computer>"]
license = "MIT"
repository = "https://github.com/diogenesoftoronto/seamagic"
keywords = ["image", "cli", "mcp", "design", "graphics"]
categories = ["command-line-utilities", "multimedia::images"]
rust-version = "1.85"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
image = "0.25"
imageproc = "0.25"
rusttype = "0.9"
ab_glyph = "0.2"
uuid = { version = "1.15", features = ["v4"] }
base64 = "0.22"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
steel-core = "0.8.2"
lazy_static = "1.5"
rayon = "1.10"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
rmcp = { version = "1.6", features = ["server", "transport-io"] }
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"
